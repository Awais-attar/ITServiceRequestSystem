<template>
    <lightning-card title="Submit Service Request">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Subject"
                value={subject}
                onchange={handleSubjectChange}>
            </lightning-input>

            <lightning-textarea
                label="Description"
                value={description}
                onchange={handleDescriptionChange}>
            </lightning-textarea>

            <lightning-button
                label="Submit Request"
                variant="brand"
                onclick={handleSubmit}>
            </lightning-button>

            <template if:true={message}>
                <p class="slds-m-top_medium">{message}</p>
            </template>

        </div>

    </lightning-card>
</template>
